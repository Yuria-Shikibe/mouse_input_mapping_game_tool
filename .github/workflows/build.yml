name: Windows Release build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config Release --parallel
      - name: Test without installing a driver
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - name: Package
        run: cpack --config build/ci/CPackConfig.cmake -C Release
      - name: Verify both executables are packaged
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($packages.Count -ne 1) { throw "Expected one Release ZIP, found $($packages.Count)" }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packages[0].FullName)
          try {
            $files = @($archive.Entries | ForEach-Object { [System.IO.Path]::GetFileName($_.FullName) })
            foreach ($exe in @('mouse_input_mapping_user.exe', 'mouse_input_mapping_kernel.exe')) {
              if ($files -notcontains $exe) { throw "Release ZIP is missing $exe" }
            }
          } finally {
            $archive.Dispose()
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mouse-input-mapping-windows-x64
          path: dist/*.zip
          if-no-files-found: error
