name: Windows build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.configuration }} --parallel
      - name: Test without installing a driver
        run: ctest --test-dir build/ci -C ${{ matrix.configuration }} --output-on-failure
      - name: Package
        if: matrix.configuration == 'Release'
        run: cpack --config build/ci/CPackConfig.cmake -C Release
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: mouse-input-mapping-windows-x64
          path: dist/*.zip
          if-no-files-found: error
