name: Windows Release build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build/ci --config Release --parallel
      # upload-artifact creates the downloadable ZIP itself.  Install the release
      # tree directly so the artifact is not a ZIP containing CPack's ZIP.
      - name: Install package tree
        run: cmake --install build/ci --config Release --prefix dist/windows-x64
      - name: Verify runtime and GUI executables are installed
        shell: pwsh
        run: |
          $packageRoot = 'dist/windows-x64'
          foreach ($exe in @('mouse_input_mapping_user.exe', 'mouse_input_mapping_kernel.exe', 'mouse_input_mapping_config.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $packageRoot $exe) -PathType Leaf)) {
              throw "Release package is missing $exe"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mouse-input-mapping-windows-x64
          path: dist/windows-x64
          if-no-files-found: error
