; Copy to config.ini beside the EXE, or use --config <path>.
; Key names or physical scan codes (0x001e, 0xe04b) are accepted.
[mapping]
left_key=A
right_key=D
toggle_key=F8

; Raw mouse counts, independent of desktop pointer acceleration.
window_ms=30
start_counts=3
reverse_counts=6
release_ms=60

; X keeps continuous key hold unless enabled. Ratio controls each pulse's hold time.
x_pulse_enabled=0
x_keyboard_override_enabled=1
x_hold_ratio=1.0
pulse_period_ms=30
