; Both runtimes share config.ini; config.user.ini is a fallback only if config.ini is absent.
; Lower start/reverse counts increase sensitivity. window_ms is a time window, not an application.
; Pulse accumulation uses max(window_ms, 2 * release_ms, 120 ms). Hold ratios apply only to pulses.
; Keys are physical scan codes; 0xe0xx means an extended key. Key names are also accepted.
[mapping]
left_key=0x001e ; A
right_key=0x0020 ; D
up_key=0x001f ; Y-: S
down_key=0x0011 ; Y+: W
lmb_key=0x004a ; SUBTRACT
rmb_key=0x0032 ; M
cmb_key=0x0014 ; T
x1_key=0x002a ; LSHIFT
x2_key=0x0021 ; F
wheel_up_key=0x0013 ; R
wheel_down_key=0x0013 ; R
toggle_key=0x0042 ; F8
window_ms=10
start_counts=3
reverse_counts=6
release_ms=60
; Smoothing: lerp previous toward each nonzero axis input; 1 = raw, 0 = no axis mapping.
x_smoothing_factor=1
y_smoothing_factor=0.84999999999999998
x_pulse_enabled=0
x_keyboard_override_enabled=1
x_hold_ratio=1
y_pulse_enabled=1
y_hold_ratio=0.45000000000000001
; Per-axis thresholds override legacy start_counts/reverse_counts.
; Curves apply only to pulses: normalized speed -> hold ratio (0..1).
; Speed is abs(net counts in the last 30ms)/0.03s; full speed is counts/s.
; Curve disabled preserves the fixed hold ratio. Points: input:output,...
x_start_counts=3
x_reverse_counts=6
x_curve_enabled=0
x_curve_full_speed=1000
x_curve_points=0:0,1:1
y_start_counts=2
y_reverse_counts=4
y_curve_enabled=0
y_curve_full_speed=1400
y_curve_points=0:0,0.32173913043478258:0.080645161290322578,1:1
pulse_period_ms=10
; Kernel Y parameters are independent from the user-mode Y settings above.
; Mapping and blocking are independent; both apply only while ON and not bypassed.
kernel_y_enabled=0
kernel_y_block=0
kernel_y_up_key=0x001f
kernel_y_down_key=0x0011
kernel_y_start_counts=2
kernel_y_reverse_counts=4
kernel_y_smoothing_factor=0.85
kernel_y_pulse_enabled=1
kernel_y_hold_ratio=0.45
kernel_y_curve_enabled=0
kernel_y_curve_full_speed=1400
kernel_y_curve_points=0:0,0.32173913043478258:0.080645161290322578,1:1
; Hold either key to suspend ALL mouse mappings and suppression.
; NONE, keyboard names/scan codes, MOUSE_LEFT/RIGHT/MIDDLE/X1/X2.
bypass_key_1=NONE
bypass_key_2=NONE

; Pie menu: hold to open, move to select, release to send UP/DOWN/LEFT/RIGHT.
; Trigger: NONE (disabled), MOUSE_LEFT/RIGHT/MIDDLE/X1/X2; LMB/RMB/CMB/X1/X2 also accepted.
; Keyboard key names / scan codes are supported too, e.g. pie_trigger=F6.
; Bind by clicking the Pie key button in the GUI, then pressing a keyboard or mouse key.
; Shares the main toggle. Kernel mode blocks XY + trigger; user mode blocks nothing.
; Normal XY pauses during Pie; other button/wheel mappings continue.
pie_trigger=NONE
pie_visual_enabled=1
; Raw counts, independent of screen pixels, Windows pointer speed and XY smoothing.
; Return inside half the deadzone to cancel; radius must exceed deadzone.
pie_deadzone_counts=12
pie_radius_counts=80
pie_hysteresis_degrees=8
pie_key_hold_ms=20

; Optional physical key -> two held keys; original trigger passes through.
chord_enabled=0
chord_trigger_key=LSHIFT
chord_first_key=SPACE
chord_second_key=C
