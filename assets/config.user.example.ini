; User-mode XY and mouse-button mapping. Disable mouse input inside the game.
; Original mouse movement/buttons are not suppressed by this program.
[mapping]
left_key=A
right_key=D
up_key=S
down_key=W
lmb_key=SUBTRACT
rmb_key=M
cmb_key=T
x1_key=LSHIFT
x2_key=F
wheel_up_key=R
wheel_down_key=R
toggle_key=F8
; Shared settings, independent per-axis state. Units: raw mouse counts.
window_ms=30
start_counts=3
reverse_counts=6
release_ms=60
; X uses continuous hold; Y pulses by default with 0.65 hold ratio.
x_pulse_enabled=0
x_keyboard_override_enabled=1
x_hold_ratio=1.0
y_pulse_enabled=1
y_hold_ratio=0.5
pulse_period_ms=1
